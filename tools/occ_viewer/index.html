<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotruck Occ Viewer</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #171b22;
      --text: #e8ecf1;
      --muted: #9aa3ad;
      --accent: #3aa0ff;
      --border: #2a313c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 13px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
    }
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
    }
    header {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    header .meta { color: var(--muted); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
    label.ctrl { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
    select, button {
      background: #222833; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 10px;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
    }
    #sidebar {
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 12px; overflow: auto;
    }
    #sidebar h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
    #view { position: relative; min-height: 0; }
    #canvas-wrap { position: absolute; inset: 0; }
    #cams {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px;
      background: var(--panel); border-top: 1px solid var(--border);
      min-height: 140px;
    }
    .cam-card {
      flex: 0 0 auto; width: 220px; background: #10141a;
      border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .cam-card.active { border-color: var(--accent); }
    .cam-card img { display: block; width: 100%; height: 124px; object-fit: cover; background: #000; }
    .cam-card .name { padding: 4px 8px; color: var(--muted); font-size: 11px; }
    .row { margin-bottom: 14px; }
    .hint { color: var(--muted); font-size: 12px; }
    #status { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Robotruck Occ Viewer</h1>
      <span class="meta" id="titleMeta">—</span>
      <div class="controls">
        <label class="ctrl">Frame
          <select id="frameSelect"></select>
        </label>
        <label class="ctrl"><input type="checkbox" id="togOcc" checked /> Occupancy</label>
        <label class="ctrl"><input type="checkbox" id="togPts" /> Points</label>
        <label class="ctrl"><input type="checkbox" id="togGrid" checked /> Ground grid</label>
        <button id="btnFit">Frame camera</button>
        <span id="status"></span>
      </div>
    </header>
    <div id="main">
      <aside id="sidebar">
        <div class="row">
          <h2>Scene</h2>
          <div class="hint" id="sceneInfo">Loading…</div>
        </div>
        <div class="row">
          <h2>Display</h2>
          <label class="ctrl"><input type="range" id="occOpacity" min="0.15" max="1" step="0.05" value="0.92" /> Occ opacity</label>
          <label class="ctrl" style="margin-top:8px"><input type="range" id="occGap" min="0" max="0.08" step="0.01" value="0.02" /> Voxel gap</label>
          <label class="ctrl" style="margin-top:8px"><input type="range" id="ptSize" min="0.02" max="0.25" step="0.01" value="0.06" /> Point size</label>
        </div>
        <div class="row">
          <h2>Help</h2>
          <div class="hint">
            Drag to orbit, scroll to zoom, right-drag to pan.<br/>
            Occupancy is solid voxels (almost abutting).<br/>
            Point cloud is optional and off by default.
          </div>
        </div>
      </aside>
      <div id="view"><div id="canvas-wrap"></div></div>
    </div>
    <div id="cams"></div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
